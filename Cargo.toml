[package]
name = "solana_low_latency"
version = "0.1.0"
edition = "2024"

[dependencies]
solana-client = "=4.2.1"
solana-keypair = "3.1.2"
solana-pubkey = "=4.2.1"
solana-commitment-config = "3.1.1"

tokio = { version = "1", features = ["full"] }

solana-hash = "4.5"
solana-system-interface = { version = "3.2", features = ["bincode"] }
solana-compute-budget-interface = "3"

solana-message = "=4.2.3"
solana-transaction = "=4.1.4"
solana-address-lookup-table-interface = "3.1.0"
bincode = "1.3.3"
base64 = "0.22"
serde_json = "1.0.151"
reqwest = { version = "0.13.5", features = ["json"] }
